<!DOCTYPE html>
<!--
  ad-delivery.html — Deploy to https://shuttlemath.com/ad-delivery.html
  Handles rewarded ads via GPT. Google sees this approved domain.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ad</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:100%; height:100%; overflow:hidden; background:transparent; }
    #overlay { display:none; position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; flex-direction:column; }
    #slot { width:336px; height:280px; display:flex; align-items:center; justify-content:center; }
    #skip { margin-top:12px; padding:8px 24px; border:2px solid #fff; border-radius:6px; background:transparent; color:#fff; font-size:14px; cursor:pointer; font-family:Arial,sans-serif; display:none; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="slot"></div>
    <button id="skip">Skip</button>
  </div>
  <script>
    var NETWORK = '22921845643';
    var UNIT    = 'H5_Game_Rewarded';
    var FULL    = '/' + NETWORK + '/' + UNIT;
    var active  = false;

    window.googletag = window.googletag || {cmd: []};
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://securepubads.g.doubleclick.net/tag/js/gpt.js';
    s.onload = function() {
      googletag.cmd.push(function() {
        googletag.pubads().enableSingleRequest();
        googletag.pubads().collapseEmptyDivs();
        googletag.enableServices();
        window.parent.postMessage({ type: 'ad-delivery-ready', unit: FULL }, '*');
      });
    };
    document.head.appendChild(s);

    function showRewarded() {
      if (active) return;
      active = true;

      var overlay = document.getElementById('overlay');
      var slot    = document.getElementById('slot');
      var skip    = document.getElementById('skip');

      slot.innerHTML = '<div id=\"gpt-rw\" style=\"width:336px;height:280px;\"></div>';
      overlay.style.display = 'flex';
      skip.style.display = 'none';

      googletag.cmd.push(function() {
        googletag.pubads().addEventListener('rewardedSlotClosed', function() {
          active = false;
          overlay.style.display = 'none';
          slot.innerHTML = '';
          window.parent.postMessage({ type: 'reward-granted', unit: FULL }, '*');
        });

        googletag
          .defineSlot(FULL, [336, 280], 'gpt-rw')
          .addService(googletag.pubads());
        googletag.display('gpt-rw');
      });

      setTimeout(function() { skip.style.display = 'block'; }, 5000);
    }

    function skip() {
      if (!active) return;
      active = false;
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('slot').innerHTML = '';
      window.parent.postMessage({ type: 'reward-skipped', unit: FULL }, '*');
    }

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'show-rewarded') showRewarded();
    });

    document.getElementById('skip').addEventListener('click', skip);
  </script>
</body>
</html>

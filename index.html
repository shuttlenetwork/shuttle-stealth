<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shuttle Stealth</title>
    <link rel="icon" type="image/png" href="shuttle.png" />
    <script
      defer
      data-domain="shuttle-stealth"
      src="https://stats.senty.com.au/js/script.outbound-links.pageview-props.tagged-events.js"
    ></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          ;(window.plausible.q = window.plausible.q || []).push(arguments)
        }
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/alpinejs" defer></script>
    <script type="module" src="shader-client.js"></script>
    <script type="module" src="shader-canvas.js"></script>
    <style>
      :root {
        /* Dark theme (default) */
        --bg-primary: #0a0c0f;
        --bg-secondary: #161b22;
        --accent: #a7f3d0;
        --accent-hover: #6ee7b7;
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
        --border: #30363d;
        --success: #238636;
        --error: #da3633;
        --warning: #d29922;
        --shadow-color: rgba(0, 0, 0, 0.5);
      }

      [data-theme="light"] {
        --bg-primary: #ffffff;
        --bg-secondary: #f6f8fa;
        --accent: #10b981;
        --accent-hover: #059669;
        --text-primary: #1f2328;
        --text-secondary: #57606a;
        --border: #d0d7de;
        --success: #1a7f37;
        --error: #cf222e;
        --warning: #9a6700;
        --shadow-color: rgba(0, 0, 0, 0.1);
      }

      /* System preference detection */
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]):not([data-theme="light"]) {
          --bg-primary: #ffffff;
          --bg-secondary: #f6f8fa;
          --accent: #10b981;
          --accent-hover: #059669;
          --text-primary: #1f2328;
          --text-secondary: #57606a;
          --border: #d0d7de;
          --success: #1a7f37;
          --error: #cf222e;
          --warning: #9a6700;
          --shadow-color: rgba(0, 0, 0, 0.1);
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      body.new-tab-page {
        overflow: auto;
      }

      /* Background Stars/Constellations Effect */
      .bg-effects {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(circle at center, #111827 0%, #0a0c0f 100%);
        overflow: hidden;
      }

      .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        opacity: 0.3;
      }

      /* Top Bar & Navigation */
      .top-bar {
        background: rgba(22, 27, 34, 0.8);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding-top: 5px;
        z-index: 100;
      }

      .tabs-container {
        display: flex;
        align-items: flex-end;
        padding: 0 10px;
        gap: 5px;
        overflow-x: auto;
      }

      .tab {
        background: transparent;
        padding: 8px 15px;
        border-radius: 8px 8px 0 0;
        font-size: 0.85rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 120px;
        max-width: 200px;
        border: 1px solid transparent;
        border-bottom: none;
        opacity: 0.6;
        transition: all 0.2s;
        color: var(--text-secondary);
      }

      .tab.active {
        background: var(--bg-secondary);
        opacity: 1;
        border-color: var(--border);
        color: var(--text-primary);
      }

      .tab-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }

      .close-tab {
        opacity: 0.5;
        font-size: 14px;
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
      }

      .close-tab:hover {
        background: rgba(255, 255, 255, 0.1);
        opacity: 1;
      }

      .new-tab-btn {
        padding: 8px 12px;
        cursor: pointer;
        opacity: 0.6;
        color: var(--text-secondary);
      }
      .new-tab-btn:hover {
        opacity: 1;
        color: var(--text-primary);
      }

      .toolbar {
        background: var(--bg-secondary);
        padding: 6px 15px;
        display: flex;
        gap: 10px;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }

      .nav-btn {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        padding: 6px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-primary);
      }
      .nav-btn:disabled {
        opacity: 0.2;
      }

      .url-bar {
        flex: 1;
        position: relative;
      }

      .url-bar input {
        width: 100%;
        padding: 7px 15px;
        padding-right: 35px;
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-primary);
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .url-bar input:focus {
        border-color: var(--accent);
      }

      .spinner-icon {
        position: absolute;
        right: 10px;
        top: 50%;
        margin-top: -8px; /* Half of height */
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        pointer-events: none;
      }

      .tab-icon-area {
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      /* Content Area */
      .content-area {
        flex: 1;
        background: var(--bg-primary);
        overflow: hidden;
        position: relative;
        display: flex;
      }

      body.new-tab-page .content-area {
        overflow: auto;
        align-items: flex-start;
        display: block;
      }

      body.new-tab-page #canvas-container {
        display: none;
      }

      #canvas-container {
        width: 100%;
        height: 100%;
        flex: 1;
        background: white; /* Iframe usually has white bg, but can be transparent */
      }

      #canvas-container iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
      }

      /* Empty State / Logo Design */
      .empty-state {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 10vh 0 40px;
        background: var(--bg-primary);
        z-index: 10;
      }

      body.new-tab-page .empty-state {
        position: relative;
        min-height: 100vh;
      }

      .logo-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 40px;
      }

      .shuttle-logo {
        font-family: 'Orbitron', sans-serif;
        font-size: 3rem;
        font-weight: 700;
        color: white;
        letter-spacing: 0.4rem;
        text-transform: uppercase;
        text-shadow: 0 0 20px rgba(167, 243, 208, 0.3);
      }

      .stealth-tag {
        font-family: 'Orbitron', sans-serif;
        font-size: 0.7rem;
        letter-spacing: 0.6rem;
        color: var(--accent);
        text-transform: uppercase;
        margin-top: -0.4rem;
        margin-left: 0.6rem;
        opacity: 0.8;
      }

      .search-container {
        width: 100%;
        max-width: 400px;
        margin-bottom: 30px;
        position: relative;
      }

      .search-container input {
        width: 100%;
        padding: 10px 18px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-primary);
        font-size: 0.95rem;
        outline: none;
        box-shadow: 0 4px 12px var(--shadow-color);
      }

      .search-container input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 15px color-mix(in srgb, var(--accent) 20%, transparent);
      }

      /* Quick Apps / Bookmarks Grid */
      .quick-apps-section {
        width: 100%;
        max-width: 900px;
        padding: 0 20px;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .section-header h3 {
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .edit-btn {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        color: var(--text-primary);
        padding: 3px 10px;
        border-radius: 4px;
        font-size: 0.75rem;
        cursor: pointer;
      }

      .quick-apps-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 10px;
      }

      .app-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        position: relative;
        transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
        aspect-ratio: 1;
        justify-content: center;
      }

      .app-card:hover {
        background: var(--bg-primary);
        transform: translateY(-3px);
        border-color: var(--accent);
        box-shadow: 0 5px 20px var(--shadow-color);
      }

      .app-icon {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        content-visibility: auto;
        contain-intrinsic-size: 24px 24px;
      }

      .app-card.game-bookmark {
        position: relative;
      }

      .app-card.game-bookmark {
        position: relative;
      }

      .app-card.game-bookmark .game-badge {
        position: absolute;
        top: -6px;
        left: -6px;
        width: 20px;
        height: 20px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        border: 2px solid var(--bg-secondary);
        z-index: 5;
      }

      .app-card.game-bookmark .game-badge span {
        animation: icon-shine 2s ease-in-out infinite;
        filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.8));
      }

      @keyframes icon-shine {
        0%, 100% { 
          filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.6));
          transform: scale(1);
        }
        50% { 
          filter: drop-shadow(0 0 6px rgba(255, 255, 255, 1)) drop-shadow(0 0 10px rgba(167, 243, 208, 0.8));
          transform: scale(1.1);
        }
      }

      .app-card.full-image {
        padding: 0;
        position: relative;
        overflow: hidden;
      }

      .app-card.full-image .game-badge {
        top: 4px;
        left: 4px;
      }

      .app-card.full-image > div {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .full-game-cover {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 10px;
        content-visibility: auto;
        contain-intrinsic-size: 80px 80px;
      }

      .full-game-name {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        font-size: 0.6rem;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
        padding: 6px 4px;
        background: color-mix(in srgb, var(--bg-primary) 85%, transparent);
        backdrop-filter: blur(4px);
        transition: background 0.2s;
        border-radius: 0 0 10px 10px;
      }

      .app-card.full-image:hover .full-game-name {
        background: color-mix(in srgb, var(--bg-primary) 95%, transparent);
      }

      .drag-hint {
        font-size: 0.7rem;
        color: var(--text-secondary);
        opacity: 0.6;
      }

      .app-name {
        font-size: 0.7rem;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
        text-align: center;
      }

      /* Edit Controls */
      .card-actions {
        position: absolute;
        top: -8px;
        right: -8px;
        display: flex;
        gap: 5px;
      }

      .action-btn {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--border);
        border: 1px solid var(--text-secondary);
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        cursor: pointer;
      }

      .action-btn.remove:hover {
        background: var(--error);
      }
      .action-btn.edit:hover {
        background: var(--accent);
        color: black;
      }

      .add-card {
        border-style: dashed;
        color: var(--text-secondary);
        justify-content: center;
      }

      /* Games Section */
      .games-section {
        width: 100%;
        max-width: 900px;
        padding: 0 20px;
        margin-top: 40px;
      }

      .games-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 12px;
        padding-right: 10px;
      }

      .games-container::-webkit-scrollbar {
        width: 8px;
      }

      .games-container::-webkit-scrollbar-track {
        background: var(--bg-secondary);
        border-radius: 4px;
      }

      .games-container::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      .games-container::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }

      .game-card {
        position: relative;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
        aspect-ratio: 1;
        overflow: hidden;
      }

      .game-card:hover,
      .app-card:hover {
        background: var(--bg-primary);
        transform: translateY(-3px);
        border-color: var(--accent);
        box-shadow: 0 5px 20px var(--shadow-color);
      }

      .game-card:hover .game-name {
        background: var(--bg-primary);
      }

      .game-card.is-dragging {
        cursor: grabbing !important;
        opacity: 0.5;
      }

      .game-card.is-dragging .game-cover {
        border: 2px solid var(--accent);
      }

      /* Drag ghost styling */
      .game-card:-webkit-drag {
        opacity: 1 !important;
        background: var(--bg-secondary);
        border: 2px solid var(--accent);
        box-shadow: 0 10px 30px var(--shadow-color);
        border-radius: 10px;
        overflow: hidden;
      }

      .game-card:-webkit-drag .game-cover {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .game-card:-webkit-drag .game-name {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: color-mix(in srgb, var(--bg-primary) 90%, transparent);
        font-size: 0.6rem;
        padding: 6px 4px;
      }

      .quick-apps-grid.drop-zone {
        background: color-mix(in srgb, var(--accent) 5%, transparent);
        border-radius: 12px;
        border: 2px dashed var(--accent);
        padding: 10px;
      }

      .game-cover {
        width: 100%;
        height: 100%;
        border-radius: 0;
        object-fit: cover;
        background: var(--bg-secondary);
        content-visibility: auto;
        contain-intrinsic-size: 130px 130px;
      }

      .game-name {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        font-size: 0.7rem;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
        padding: 8px 6px;
        background: color-mix(in srgb, var(--bg-primary) 85%, transparent);
        backdrop-filter: blur(4px);
        transition: background 0.2s;
      }

      .game-search-container {
        margin-bottom: 15px;
      }

      .game-search-input {
        width: 100%;
        padding: 10px 15px;
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 0.9rem;
        outline: none;
        transition: all 0.2s;
      }

      .game-search-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(167, 243, 208, 0.1);
      }

      .game-search-input::placeholder {
        color: var(--text-secondary);
      }

      .games-loading {
        text-align: center;
        padding: 40px;
        color: var(--text-secondary);
        font-size: 0.9rem;
      }

      .games-error {
        text-align: center;
        padding: 20px;
        color: var(--error);
        font-size: 0.85rem;
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        backdrop-filter: blur(4px);
      }

      .modal {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 12px;
        width: 100%;
        max-width: 400px;
        padding: 25px;
        box-shadow: 0 10px 40px var(--shadow-color);
      }

      .startup-popup-overlay {
        position: fixed;
        inset: 0;
        z-index: 2500;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.82);
        backdrop-filter: blur(6px);
      }

      .startup-popup {
        width: 80vw;
        height: 80vh;
        min-width: 280px;
        min-height: 360px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 20px 70px var(--shadow-color);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .startup-popup-bar {
        height: 42px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        padding: 0 10px;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
      }

      .startup-popup-countdown {
        color: var(--text-secondary);
        font-size: 0.78rem;
      }

      .startup-popup-close {
        width: 28px;
        height: 28px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-primary);
        color: var(--text-primary);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .startup-popup-close:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .startup-popup-frame {
        width: 100%;
        height: 100%;
        border: 0;
        background: white;
      }

      .modal h4 {
        margin-bottom: 20px;
        font-weight: 500;
      }

      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }
      .form-group input {
        width: 100%;
        padding: 10px 12px;
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-primary);
        outline: none;
      }
      .form-group input:focus {
        border-color: var(--accent);
      }

      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 25px;
      }

      .btn {
        padding: 8px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        border: none;
      }
      .btn-cancel {
        background: transparent;
        color: var(--text-secondary);
      }
      .btn-cancel:hover {
        color: var(--text-primary);
      }
      .btn-save {
        background: var(--accent);
        color: black;
        font-weight: 600;
      }
      .btn-save:hover {
        background: var(--accent-hover);
      }

      /* Loading */
      .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg-primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 2000;
      }

      .spinner {
        width: 30px;
        height: 30px;
        border: 3px solid color-mix(in srgb, var(--text-primary) 10%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 15px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body x-data="shuttleApp()">
    <!-- Initialization Overlay -->
    <div x-show="!ready && !error" class="loading-overlay">
      <div class="spinner"></div>
      <p style="font-size: 0.9rem; opacity: 0.6">Initializing Shuttle Stealth...</p>
    </div>

    <!-- Startup Popup -->

            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>

    <!-- Main Content -->
    <div class="content-area" x-show="ready" style="display: none">
      <!-- ShaderCanvas manages iframes here -->
      <div id="canvas-container"></div>

      <!-- New Tab / Search View Overlay -->
      <div class="empty-state" x-show="showNewTabUI">
        <div class="logo-group">

          <div

                        :alt="bm.name"
                        width="24"
                        height="24"
                        loading="lazy"
                        decoding="async"
                        onerror="this.onerror=null;this.src='shuttle.png'"
                      />

                    <span class="app-name" x-text="bm.name"></span>
                  </div>

                <div class="card-actions" x-show="isEditingBookmarks">
                  <div class="action-btn edit" @click.stop="editBookmark(bm)">✎</div>
                  <div class="action-btn remove" @click.stop="removeBookmark(bm.id)">×</div>
                </div>
              </div>

            <div class="app-card add-card" x-show="isEditingBookmarks" @click="openAddModal()">
              <div style="font-size: 20px">+</div>

        <div class="games-section" x-data="gamesApp()" x-init="initGames()">
          <div class="section-header">
            <div>
              <h3>Games</h3>
              <span class="drag-hint">drag games to quick apps</span>
            </div>
            <span x-show="gamesLoading" style="font-size: 0.75rem; color: var(--text-secondary)">Loading...</span>
          </div>

          <div class="game-search-container" x-show="!gamesLoading && !gamesError">
            <input
              type="text"
              x-model="gameSearch"
              @input="filterGames()"
              placeholder="Search games..."
              class="game-search-input"
            />

          <div class="games-container" x-show="!gamesLoading && !gamesError">
            <template x-for="game in filteredGames" :key="game.id">
              <div
                class="game-card"
                @click="!isDragging && openGame(game)"
                draggable="true"
                @dragstart="isDragging = true; $el.classList.add('is-dragging'); $event.dataTransfer.setData('gameId', game.id); $event.dataTransfer.setData('gameData', JSON.stringify(game))"
                @dragend="setTimeout(() => { isDragging = false; $el.classList.remove('is-dragging'); }, 50)"
              >
                <img
                  class="game-cover"
                  :src="'https://images.weserv.nl/?url=' + encodeURIComponent(game.cover.replace('{COVER_URL}', 'https://cdn.jsdelivr.net/gh/freebuisness/covers@main')) + '&w=260&h=260&fit=cover&output=webp'"
                  :alt="game.name"
                  width="130"
                  height="130"
                  loading="lazy"
                  decoding="async"
                  onerror="this.onerror=null;this.src='shuttle.png'"
                />
                <span class="game-name" x-text="game.name"></span>
              </div>
            </template>
          </div>

          <div class="games-loading" x-show="gamesLoading">
            <div class="spinner" style="margin: 0 auto 15px; width: 24px; height: 24px; border-width: 2px"></div>

    <!-- Bookmark Modal -->
    <div class="modal-overlay" x-show="showBookmarkModal" x-transition.opacity style="display: none">
      <div class="modal" @click.away="showBookmarkModal = false">
        <h4 x-text="bookmarkForm.id ? 'Edit Bookmark' : 'Add Bookmark'"></h4>
        <div class="form-group">
          <label>Name</label>
          <input type="text" x-model="bookmarkForm.name" placeholder="My App" />
        </div>
        <div class="form-group">
          <label>URL</label>
          <input type="text" x-model="bookmarkForm.url" placeholder="https://example.com" />
        </div>
        <div class="form-group">
          <label>Icon URL (optional)</label>
          <input type="text" x-model="bookmarkForm.icon" placeholder="https://.../favicon.png" />
        </div>
        <div class="modal-footer">
          <button class="btn btn-cancel" @click="showBookmarkModal = false">Cancel</button>
          <button class="btn btn-save" @click="saveBookmark()">Save</button>
        </div>
      </div>
    </div>

    <script>
      function shuttleApp() {
        return {
          canvas: null,
          ready: false,
          error: null,
          tabs: [],
          activeTabId: null,
          currentUrlInput: '',
          showStartupPopup: false,
          canCloseStartupPopup: false,
          startupPopupSecondsRemaining: 10,
          startupPopupUrl: 'https://colormagic.app/play/lines',

          // Bookmarks state
          bookmarks: [],
          isEditingBookmarks: false,
          showBookmarkModal: false,
          bookmarkForm: { id: null, name: '', url: '', icon: '' },
          isDraggingOver: false,

          // Theme state
          theme: localStorage.getItem('shuttle-theme') || 'system',

          get activeTab() {
            return this.tabs.find((t) => t.id === this.activeTabId)
          },
          get isLoading() {
            return this.activeTab ? this.activeTab.loading : false
          },
          get showNewTabUI() {
            const isNewTab = !this.activeTab || !this.activeTab.url || this.activeTab.url === 'about:blank' || this.activeTab.url.includes('/newtab.html')
            // Toggle body scroll class
            if (isNewTab) {
              document.body.classList.add('new-tab-page')
            } else {
              document.body.classList.remove('new-tab-page')
            }
            return isNewTab
          },

          async init() {
            // Initialize theme
            this.applyTheme(this.theme)
            // Startup popup is disabled while testing the main-page H5 ad unit.

            // Define defaults
            const defaults = [
              { id: 1, name: 'YouTube', url: 'https://youtube.com?search=shuttle+proxy' },
              { id: 2, name: 'GitHub', url: 'https://github.com' },
              { id: 3, name: 'Discord', url: 'https://discord.com' },
              { id: 4, name: 'TikTok', url: 'https://tiktok.com' },
              { id: 5, name: 'Google', url: 'https://google.com' },
              { id: 6, name: 'Twitter/X', url: 'https://twitter.com' },
              { id: 7, name: 'Roblox', url: 'https://roblox.com' },
              { id: 8, name: 'GeForce', url: 'https://play.geforcenow.com' },
            ]

            // 1. Load and Merge bookmarks
            const savedBookmarks = localStorage.getItem('shuttle_bookmarks')
            if (savedBookmarks) {
              this.bookmarks = JSON.parse(savedBookmarks).map((bm) => {
                // Sanitize broken icons
                if (bm.icon && bm.icon.includes('google.com/s2/favicons?domain=about:blank')) {
                  bm.icon = ''
                }

                // Update if it's a default bookmark (merge to get latest URL)
                const defaultBm = defaults.find((d) => d.id === bm.id)
                if (defaultBm) {
                  return { ...bm, ...defaultBm }
                }
                return bm
              })

              // Save the updates immediately
              this.saveToStorage()
            } else {
              this.bookmarks = defaults
              this.saveToStorage()
            }

            // 2. Import Libraries Dynamically
            const { ShaderCanvas } = await import('./shader-canvas.js')
            // ShaderClient is imported by ShaderCanvas usually, or we can import it if needed for static props
            const { ShaderClient } = await import('./shader-client.js')

            // 3. Initialize ShaderCanvas
            this.canvas = new ShaderCanvas('canvas-container')

            // Bind Events
            this.canvas.on(ShaderCanvas.EVENTS.SURFACE_CREATED, (s) => this.refreshTabs())
            this.canvas.on(ShaderCanvas.EVENTS.SURFACE_CLOSED, () => this.refreshTabs())

            this.canvas.on(ShaderCanvas.EVENTS.SURFACE_CHANGE, (s) => {
              this.activeTabId = s ? s.id : null
              if (s) {
                this.updateFromSurface(s)
              } else {
                this.currentUrlInput = ''
              }
            })

            this.canvas.on(ShaderCanvas.EVENTS.URL_CHANGE, (data) => {
              // Don't show newtab.html in address bar
              this.currentUrlInput =
                data.decoded.includes('/newtab.html') || data.decoded === 'about:blank' ? '' : data.decoded
              this.refreshTabs()
            })

            this.canvas.on(ShaderCanvas.EVENTS.TITLE_CHANGE, () => this.refreshTabs())
            this.canvas.on(ShaderCanvas.EVENTS.FAVICON_CHANGE, () => this.refreshTabs())
            this.canvas.on(ShaderCanvas.EVENTS.LOADING_START, () => this.refreshTabs())
            this.canvas.on(ShaderCanvas.EVENTS.LOADING_STOP, () => this.refreshTabs())

            this.canvas.on(ShaderCanvas.EVENTS.READY, () => {
              this.ready = true
            })

            this.canvas.on(ShaderCanvas.EVENTS.ERROR, (e) => {
              console.error(e)
            })

            // Start with one tab
            this.addTab()

            // Listen for game open events from games section
            window.addEventListener('open-game-url', async (e) => {
              const url = e.detail.url
              // Convert to game:// protocol
              const gameProtocolUrl = url.replace(/^https:\/\//, 'game://')
              this.currentUrlInput = gameProtocolUrl
              const id = await this.canvas.createGameSurface(url)
              this.canvas.switchSurface(id)
            })
          },

          updateFromSurface(surface) {
            if (surface.isGame) {
              // Game surfaces (game:// protocol)
              this.currentUrlInput = surface.protocolUrl || ''
            } else if (surface.client) {
              const rawUrl = surface.client._lastUrl || ''
              const decoded = surface.client.decode(rawUrl)
              this.currentUrlInput = decoded === 'about:blank' ? '' : decoded
            }
          },

          scheduleStartupPopup() {
            setTimeout(() => {
              this.showStartupPopup = true
              this.canCloseStartupPopup = false
              this.startupPopupSecondsRemaining = 10
              this.$nextTick(() => {
                if (this.$refs.startupPopupFrame && !this.$refs.startupPopupFrame.src) {
                  this.$refs.startupPopupFrame.allowFullscreen = true
                  this.$refs.startupPopupFrame.src = this.startupPopupUrl
                }
              })

              const closeTimer = setInterval(() => {
                this.startupPopupSecondsRemaining -= 1

                if (this.startupPopupSecondsRemaining <= 0) {
                  clearInterval(closeTimer)
                  this.startupPopupSecondsRemaining = 0
                  this.canCloseStartupPopup = true
                }
              }, 1000)
            }, 3000)
          },

          closeStartupPopup() {
            if (!this.canCloseStartupPopup) return
            this.showStartupPopup = false
          },

          refreshTabs() {
            this.tabs = Array.from(this.canvas.surfaces.values()).map((s) => {
              // Handle game surfaces (game:// protocol)
              if (s.isGame) {
                return {
                  id: s.id,
                  title: s.title,
                  favicon: s.favicon || 'shuttle.png',
                  loading: false,
                  url: s.protocolUrl,
                }
              }
              
              // Handle proxy surfaces
              const client = s.client
              const rawUrl = client ? client._lastUrl || '' : ''
              const decoded = client ? client.decode(rawUrl) : ''
              return {
                id: s.id,
                title: s.title,
                favicon: s.favicon,
                loading: client ? client.getState().loading : false,
                url: decoded,
              }
            })
            // Update document title based on active tab
            if (this.activeTab) {
              document.title =
                this.activeTab.title && this.activeTab.title !== 'New Tab'
                  ? `${this.activeTab.title} - Shuttle Stealth`
                  : 'Shuttle Stealth'
            }
          },

          saveToStorage() {
            localStorage.setItem('shuttle_bookmarks', JSON.stringify(this.bookmarks))
          },

          addTab() {
            const id = this.canvas.createSurface()
            this.canvas.switchSurface(id)
          },

          closeTab(id) {
            this.canvas.closeSurface(id)
          },

          activateTab(id) {
            this.canvas.switchSurface(id)
          },

          navigate() {
            if (!this.currentUrlInput) return
            // If no active surface or it's a game surface, create new proxy surface
            const activeSurface = this.canvas.activeSurface
            if (!activeSurface || activeSurface.isGame || !activeSurface.client) {
              const id = this.canvas.createSurface(this.currentUrlInput)
              this.canvas.switchSurface(id)
            } else {
              this.canvas.navigate(this.currentUrlInput)
            }
          },

          async navigateBookmark(bm) {
            // Open in new tab for both games and regular bookmarks
            this.currentUrlInput = bm.url
            
            if (bm.isGame) {
              // Games use game:// protocol
              const gameProtocolUrl = bm.url.replace(/^https:\/\//, 'game://')
              this.currentUrlInput = gameProtocolUrl
              const id = await this.canvas.createGameSurface(bm.url)
              this.canvas.switchSurface(id)
            } else {
              // Regular websites use proxy - pass URL to createSurface
              const id = this.canvas.createSurface(bm.url)
              this.canvas.switchSurface(id)
            }
          },

          reloadTab() {
            this.canvas.reload()
          },

          goBack() {
            this.canvas.goBack()
          },

          goForward() {
            this.canvas.goForward()
          },

          toggleFullscreen() {
            const activeSurface = this.canvas.activeSurface
            if (activeSurface?.iframe) {
              const iframe = activeSurface.iframe
              if (iframe.requestFullscreen) {
                iframe.requestFullscreen()
              } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen()
              } else if (iframe.mozRequestFullScreen) {
                iframe.mozRequestFullScreen()
              }
            }
          },

          // Theme management
          cycleTheme() {
            const themes = ['system', 'light', 'dark']
            const currentIndex = themes.indexOf(this.theme)
            const nextIndex = (currentIndex + 1) % themes.length
            this.theme = themes[nextIndex]
            this.applyTheme(this.theme)
            localStorage.setItem('shuttle-theme', this.theme)
          },

          applyTheme(theme) {
            const root = document.documentElement
            if (theme === 'system') {
              root.removeAttribute('data-theme')
            } else {
              root.setAttribute('data-theme', theme)
            }
          },

          // Bookmark management
          openAddModal() {
            this.bookmarkForm = { id: null, name: '', url: '', icon: '' }
            this.showBookmarkModal = true
          },

          editBookmark(bm) {
            this.bookmarkForm = { ...bm }
            this.showBookmarkModal = true
          },

          removeBookmark(id) {
            this.bookmarks = this.bookmarks.filter((b) => b.id !== id)
            this.saveToStorage()
          },

          saveBookmark() {
            if (!this.bookmarkForm.name || !this.bookmarkForm.url) return

            if (this.bookmarkForm.id) {
              const idx = this.bookmarks.findIndex((b) => b.id === this.bookmarkForm.id)
              this.bookmarks[idx] = { ...this.bookmarkForm }
            } else {
              this.bookmarks.push({
                ...this.bookmarkForm,
                id: Date.now(),
              })
            }
            this.saveToStorage()
            this.showBookmarkModal = false
          },

          handleDrop(event) {
            this.isDraggingOver = false
            const gameData = event.dataTransfer.getData('gameData')
            if (!gameData) return
            
            try {
              const game = JSON.parse(gameData)
              // Check if game is already in bookmarks
              const exists = this.bookmarks.some(bm => bm.url && bm.url.includes(game.id + '.html'))
              if (exists) {
                alert('This game is already in your Quick Apps!')
                return
              }
              
              // Add game to bookmarks
              const coverUrl = game.cover.replace('{COVER_URL}', 'https://cdn.jsdelivr.net/gh/freebuisness/covers@main')
              const htmlUrl = game.url.replace('{HTML_URL}', 'https://cdn.jsdelivr.net/gh/freebuisness/html@main')
              
              this.bookmarks.push({
                id: 'game-' + game.id + '-' + Date.now(),
                name: game.name,
                url: htmlUrl,
                icon: coverUrl,
                isGame: true
              })
              
              this.saveToStorage()
            } catch (e) {
              console.error('Error adding game to bookmarks:', e)
            }
          },
        }
      }

      // Games App Component
      function gamesApp() {
        return {
          games: [],
          filteredGames: [],
          gameSearch: '',
          gamesLoading: true,
          gamesError: null,
          isDragging: false,
          
          async initGames() {
            const zonesURL = 'https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json'
            
            try {
              const response = await fetch(zonesURL + '?t=' + Date.now())
              if (!response.ok) throw new Error('Failed to fetch games')
              
              const data = await response.json()
              // Filter out external links (keep only local games with HTML files)
              this.games = data.filter(game => !game.url.startsWith('http'))
              this.filteredGames = this.games
              this.gamesLoading = false
            } catch (error) {
              console.error('Error loading games:', error)
              this.gamesError = 'Failed to load games. Please try again later.'
              this.gamesLoading = false
            }
          },
          
          filterGames() {
            const query = this.gameSearch.toLowerCase().trim()
            if (!query) {
              this.filteredGames = this.games
            } else {
              this.filteredGames = this.games.filter(game => 
                game.name.toLowerCase().includes(query)
              )
            }
          },
          
          openGame(game) {
            const htmlUrl = game.url.replace('{HTML_URL}', 'https://cdn.jsdelivr.net/gh/freebuisness/html@main')
            // Dispatch event to parent to open in new tab
            window.dispatchEvent(new CustomEvent('open-game-url', { detail: { url: htmlUrl } }))
          }
        }
      }
    </script>
  </body>
</html>
